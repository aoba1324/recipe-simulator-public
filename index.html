<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body><title>レシピシミュレータ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
/* 台所のコンロ前に立つ人向け。大きな文字と大きなボタン。上にシミュレーション、下に手順。 */
:root{
  --bg:#eef2ef; --card:#fbfcfb; --ink:#1d2925; --sub:#5f6f69; --line:#d6ded9;
  --acc:#d63a2b; --acc-ink:#fff; --teal:#2b7a69; --teal-soft:#d9ece6; --chip:#e3eae6; --warn:#b4570f; --warn-soft:#fbe8d2;
  --shadow:0 1px 3px rgba(20,40,30,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --card:#1b2421; --ink:#eaf1ed; --sub:#a1b2aa; --line:#2c3833;
  --acc:#ff6b58; --acc-ink:#1b0905; --teal:#59c2a9; --teal-soft:#1f3a33; --chip:#27322e; --warn:#f0a35b; --warn-soft:#3b2a17;
  --shadow:0 1px 3px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --card:#1b2421; --ink:#eaf1ed; --sub:#a1b2aa; --line:#2c3833;
  --acc:#ff6b58; --acc-ink:#1b0905; --teal:#59c2a9; --teal-soft:#1f3a33; --chip:#27322e; --warn:#f0a35b; --warn-soft:#3b2a17;
  --shadow:0 1px 3px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Maru Gothic',-apple-system,'Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif;font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
#app{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3,p{margin:0}
.top{display:flex;align-items:center;gap:8px;min-height:44px;margin-bottom:8px}
.top h2{font-size:18px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{border:0;background:var(--chip);border-radius:12px;min-width:44px;height:44px;padding:0 12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub{color:var(--sub);font-size:14px}
.btn{border:0;border-radius:14px;min-height:48px;padding:0 18px;font-weight:900;background:var(--chip)}
.btn.main{background:var(--acc);color:var(--acc-ink)}
.btn.teal{background:var(--teal);color:var(--bg)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.armed{background:var(--warn-soft);color:var(--warn);outline:2px solid var(--warn)}
.btn:disabled{opacity:.45}
[hidden]{display:none!important}
.hero{padding:18px 4px 6px}
.hero h1{font-size:34px;font-weight:900;letter-spacing:.02em}
.hero p{color:var(--sub);margin-top:4px}
.dish{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.dish .em{font-size:40px;width:64px;height:64px;border-radius:16px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;flex:none}
.dish b{font-size:20px;display:block}
.dish .th{width:88px;height:88px;border-radius:16px;object-fit:cover;flex:none;background:var(--teal-soft)}
.hero2{display:flex;flex-direction:column;gap:8px}.hero2 img{width:100%;border-radius:14px;display:block;aspect-ratio:1/1;object-fit:cover;background:var(--teal-soft)}
.dish.off{opacity:.55;border-style:dashed;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid transparent;background:var(--chip);border-radius:999px;min-height:40px;padding:0 14px;font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--teal);color:var(--bg)}
.chip.rec::after{content:"★";margin-left:4px;color:var(--acc)}
.chip[aria-pressed="true"].rec::after{color:var(--bg)}
.ing{display:flex;flex-direction:column;gap:10px}
.ing .head{display:flex;align-items:center;gap:10px}
.ing .head .artw{flex:none;display:flex}
.ing>.row{align-self:flex-start}
.art{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--chip)}
.ing .head b{font-size:17px;flex:1;min-width:3.2em}
.ing .qty{font-weight:700;color:var(--teal);font-size:15px}
.ing.off{opacity:.6}
.opt{display:flex;flex-direction:column;gap:4px}
.opt label{font-size:13px;color:var(--sub);font-weight:700}
.sw{width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--teal)}
.sw[aria-pressed="true"]::after{transform:translateX(22px)}
.sw:disabled{opacity:.5}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font-size:22px;min-width:84px;text-align:center}
.stepper .btn{min-width:48px;padding:0;font-size:22px}
input[type=text]{font:inherit;width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px}
.saved{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.saved .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.saved .nm small{display:block;color:var(--sub);font-weight:400}
/* cook */
.dots{display:flex;gap:6px;flex:1;min-width:0}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--teal)}
.dots i.cur{background:var(--acc)}
.simwrap{position:relative;border-radius:18px;overflow:hidden;background:#232326;box-shadow:var(--shadow)}
#cv{display:block;width:100%;aspect-ratio:1/1;pointer-events:none}
.simwrap.dragging{touch-action:none}
.badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.badge.warn{background:#b4570f}
.hint{position:absolute;left:10px;right:10px;bottom:8px;text-align:center;color:#fff;font-size:12px;opacity:.75;pointer-events:none;text-shadow:0 1px 2px #000}
.ctl{display:flex;flex-direction:column;gap:8px}
.ctl .l{font-size:13px;font-weight:700;color:var(--sub);min-width:46px}
.ctl .r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stepcard h3{font-size:22px;font-weight:900;line-height:1.35}
.tag{display:inline-block;background:var(--teal-soft);color:var(--teal);border-radius:8px;padding:1px 10px;font-weight:700;font-size:13px}
.stepcard .txt{font-size:18px;margin-top:6px}
.tip{background:var(--teal-soft);border-radius:12px;padding:10px 12px;font-size:15px;margin-top:10px}
.tip b{color:var(--teal)}
.gauge{position:relative;height:16px;border-radius:8px;background:var(--chip);overflow:hidden;margin:6px 0 4px}
.gauge i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#e9a1a0,#d9b489,#9b6038);border-radius:8px;transition:width .3s}
.gauge.s i{background:linear-gradient(90deg,#c8402e,#6a3414)}
.gauge .zone{position:absolute;top:0;bottom:0;border:2px solid var(--teal);background:rgba(43,122,105,.22);border-radius:6px}
.stat{font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.bar>div{max-width:520px;margin:0 auto;display:flex;gap:10px}
.bar .btn{min-height:54px;font-size:18px}
.bar .main{flex:1}
.refs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.refs img{width:96px;height:96px;object-fit:cover;border-radius:12px;flex:none;border:1px solid var(--line)}
.refs label.add{width:96px;height:96px;border-radius:12px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer}
.refs input{display:none}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.lb img{max-width:100%;max-height:70vh;border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:700;z-index:60;max-width:90vw;font-size:14px}
.done{text-align:center;padding:24px 8px}
.done h2{font-size:30px;font-weight:900}
details summary{font-weight:900;cursor:pointer;min-height:36px;display:flex;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
 <section id="sc-menu" class="stack">
  <div class="hero"><h1>レシピシミュレータ</h1><p>動きを見ながら、自分の手元と同じペースで進める料理ガイド</p></div>
  <div id="dishes" class="stack"></div>
  <details class="card" id="backup">
   <summary>データのバックアップ</summary>
   <p class="sub" style="margin:4px 0 10px">保存した設定と参考写真を1つのファイルに書き出せます。端末を変えるときや、念のための控えに。</p>
   <div class="row"><button class="btn sm" id="bkOut">書き出す</button><label class="btn sm" style="display:inline-flex;align-items:center">読み込む<input id="bkIn" type="file" accept=".json,application/json" hidden></label></div>
  </details>
 </section>

 <section id="sc-setup" class="stack" hidden>
  <div class="top"><button class="ico" id="setupBack" aria-label="メニューに戻る">←</button><h2 id="setupTitle"></h2></div>
  <div class="card"><div class="stepper"><span class="sub" style="font-weight:700">人数</span><button class="btn" id="svMinus" aria-label="1人減らす">−</button><b id="svNum">2人前</b><button class="btn" id="svPlus" aria-label="1人増やす">＋</button></div></div>
  <div class="card hero2" id="hero2" hidden><div id="heroBox"></div><div class="row" id="viewRow"></div></div>
  <div id="ings" class="stack"></div>
  <div class="card stack"><b>くらしの手帳に送る</b><span class="sub">コピーして、くらしの手帳の「貼り付け」に貼ると、買い物リストや料理に入れられます。</span>
   <div class="row"><button class="btn sm" id="cpIngs">材料をコピー</button><button class="btn sm" id="cpDish">料理をコピー</button></div>
   <textarea id="cpTa" rows="4" hidden readonly aria-label="コピーする内容"></textarea></div>
  <div class="card stack">
   <b>設定を保存する</b>
   <div class="row" style="flex-wrap:nowrap"><input type="text" id="svName" placeholder="名前（例：いつもの味）" maxlength="30" aria-label="保存名"><button class="btn teal" id="svSave" style="flex:none">保存</button></div>
   <div id="svList"></div>
  </div>
  <div class="card stack"><b>完成のお手本写真</b><span class="sub">自分で撮った完成写真を置いておけます</span><div id="finalRefs"></div></div>
 </section>

 <section id="sc-cook" class="stack" hidden>
  <div class="top"><button class="ico" id="cookBack" aria-label="設定に戻る">←</button><div class="dots" id="dots"></div><button class="ico" id="snd" aria-label="音" aria-pressed="true">🔊</button></div>
  <div class="simwrap" id="simwrap"><canvas id="cv"></canvas><div class="badge" id="badge" hidden></div></div>
  <div class="card stepcard" id="stepcard"></div>
  <div class="card ctl">
   <div class="row" id="heatRow"><span class="l">火力</span><div class="r" id="heat"></div></div>
   <div id="tempRow"><div class="row" style="justify-content:space-between"><span class="l">フライパン</span><span class="stat" id="tempTxt" style="font-size:14px"></span></div><div class="gauge" style="margin:2px 0"><i id="tempBar" style="width:0;background:linear-gradient(90deg,#7aa8d6,#f0b34a,#e0482b)"></i><b class="zone" id="tempZone" style="left:60%;width:25%"></b></div></div>
   <div class="row"><span class="l">速さ</span><div class="r" id="speed"></div></div>
   <div class="row"><button class="btn sm" id="replay">↻ この手順をもう一度見る</button></div>
  </div>
  <div class="card stack"><b>この手順の参考写真</b><div id="stepRefs"></div></div>
 </section>

 <section id="sc-done" class="stack" hidden>
  <div class="card"><img id="doneImg" alt="完成のようす" style="width:100%;display:block;border-radius:12px"></div>
  <div class="card done"><h2>完成です</h2><p class="sub" style="margin-top:6px">おつかれさまでした。うまくいった点、気になった点は、あとで教えてください。</p></div>
  <div class="card stack"><b>完成のお手本写真</b><div id="doneRefs"></div></div>
  <div class="row"><button class="btn teal" id="again">もう一度つくる</button><button class="btn" id="toMenu">メニューへ</button></div>
 </section>
</div>

<div class="bar" id="bar" hidden><div><button class="btn" id="prev">← 前へ</button><button class="btn main" id="next">できた！次へ →</button></div></div>
<div class="bar" id="barSetup" hidden><div><button class="btn main" id="start">この設定でつくりはじめる →</button></div></div>
<div id="lbHost"></div>
<div id="toastHost"></div>

<script>
'use strict';
/* ========== 保存 ========== */
const mem={};
function sget(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return (k in mem)?mem[k]:d}}
function sset(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){mem[k]=v;return false}}
const $=s=>document.querySelector(s);
let toastT=0;
function toast(m){const h=$('#toastHost');h.innerHTML='';const d=document.createElement('div');d.className='toast';d.textContent=m;h.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>h.innerHTML='',2400)}
function arm(btn,label,fn){ if(btn._arm){clearTimeout(btn._t);btn._arm=false;btn.classList.remove('armed');btn.textContent=btn._orig;fn();return}
  btn._orig=btn.textContent;btn._arm=true;btn.classList.add('armed');btn.textContent=label;
  btn._t=setTimeout(()=>{btn._arm=false;btn.classList.remove('armed');btn.textContent=btn._orig},3000)}

/* ========== レシピ（ここを書き換えると内容が増やせる） ========== */
function fr(n){const q=Math.round(n*4)/4,w=Math.floor(q),f=q-w;return (w?String(w):'')+({0:'',.25:'¼',.5:'½',.75:'¾'}[f])||'0'}
const RECIPES=[{
 id:'butakimchi',name:'豚キムチ',emoji:'🥘',time:'約10分',baseServings:2,
 desc:'豚肉・キムチ・醤油だけのいちばん基本の作り方',
 ingredients:[
  {id:'pork',name:'豚肉',emoji:'🥩',required:true,fmt:s=>fr(s.servings)+'パック',
   opts:[{k:'part',label:'部位',ch:[['momo','もも肉切り落とし'],['bara','バラ'],['koma','こま切れ'],['loin','ロース']],def:'momo'},
         {k:'cut',label:'切り方（大きさ）',ch:[['s','小さめ'],['m','ふつう'],['l','大きめ']],def:'m'}]},
  {id:'kimchi',name:'キムチ',emoji:'🥬',required:true,fmt:(s,o)=>{const f={less:.5,mid:1,more:1.5}[o.amt];return fr(f)+'パック（'+Math.round(440*f)+'g）'},
   opts:[{k:'amt',label:'量',ch:[['less','半分くらい'],['mid','1パック丸ごと'],['more','多め']],def:'mid'},
         {k:'cut',label:'大きさ',ch:[['fine','刻み（パックのまま）'],['bite','一口大'],['zaku','ざく切り']],def:'fine'}]},
  {id:'soy',name:'醤油',emoji:'🍶',required:true,fmt:(s,o)=>rounds(s)+'回し',
   opts:[{k:'rounds',label:'回しかける数',ch:[['auto','おまかせ'],['1','1回し'],['2','2回し']],def:'auto'}]},
  {id:'rice',name:'ご飯',emoji:'🍚',required:false,def:true,fmt:(s,o)=>o.state==='cook'?o.go+'合':'',
   opts:[{k:'state',label:'ご飯の状態',ch:[['ready','炊いてある'],['cook','これから炊く']],def:'ready'},{k:'go',label:'何合炊く？',show:o=>o.state==='cook',ch:[['1','1合'],['1.5','1.5合'],['2','2合'],['3','3合']],def:'1'},{k:'amt',label:'よそう量（自分）',ch:[['small','少なめ'],['mid','ふつう'],['large','大盛り']],def:'mid'},{k:'her',label:'よそう茶碗',ch:[['yes','自分と彼女の2つ'],['no','自分だけ']],def:'yes'},{k:'amtHer',label:'よそう量（彼女）',show:o=>o.her==='yes',ch:[['small','少なめ'],['mid','ふつう'],['large','大盛り']],def:'mid'}]},
  {id:'oil',name:'オリーブオイル',emoji:'🫒',required:true,fmt:(s,o)=>({less:'小さじ1',mid:s.servings>2?'大さじ1½':'大さじ1',more:s.servings>2?'大さじ2':'大さじ1½'}[o.amt]),
   opts:[{k:'amt',label:'量',ch:[['less','少なめ'],['mid','ふつう'],['more','多め']],def:'mid'}]},
  {id:'nira',name:'ニラ',emoji:'🌿',required:false,def:false,fmt:s=>fr(s.servings*.5)+'束',
   opts:[{k:'cut',label:'切り方',ch:[['4','4cm'],['2','2cm']],def:'4'}]},
  {id:'sesame',name:'ごま油（仕上げ）',emoji:'🥄',required:false,def:false,fmt:()=>'小さじ1',opts:[]}
 ],
 riceStep:{id:'rice0',title:'ご飯を炊きはじめる',heat:0,noHeat:true,scene:'cooker',time:'約1分（炊飯は40分前後）',watch:'rice',actions:s=>['cooker'],
   text:s=>`お米（${qty(s,'rice')}）を研いで、水を入れ、炊飯器のスイッチを入れます。`,
   tip:'炊飯は40分くらいかかります。先にスイッチを入れておけば、豚キムチができるころに炊きあがります。'},
 plateStep:{id:'plate',title:'お皿に盛り付ける',heat:0,noHeat:true,scene:'table',time:'約1分',watch:'none',actions:s=>['plate'],
   text:s=>'火を止めて、フライパンから大きくて深い白いお皿に移します。',tip:'フライパンに残った汁も、かけると味がなじみます。'},
 serveStep:{id:'serve',title:'ご飯をよそって完成',heat:0,noHeat:true,scene:'table',time:'約1分',watch:'none',actions:s=>['serve'],
   text:s=>s.items.rice.opts.her==='yes'?'青い線の茶碗（自分）と、使い捨ての耐熱容器（彼女）にご飯をよそって、豚キムチのお皿と並べたら完成です。':'青い線の茶碗にご飯をよそって、豚キムチのお皿と並べたら完成です。',tip:'ご飯はふんわり山にすると、きれいに見えます。'},
 steps:[
  {id:'oil',title:'フライパンにオリーブオイルをしく',heat:1,heatNote:'弱火にかけて、温めはじめる',time:'約30秒〜1分',watch:'oil',
   actions:s=>['oil'],
   text:s=>`フライパンにオリーブオイル（${qty(s,'oil')}）を入れて、全体に広げます。`,
   tip:'火をつけると、フライパンは余熱でじわじわ温まります。油を広げている間に温めておくと、お肉を入れたときにジュッと焼けます。ふちの近くまで薄く広げると、くっつきにくくなります。'},
  {id:'pork',title:'豚肉を焼いて、焼き色がついたものから返す',heat:2,time:'1〜2分',watch:'sear',autoFlip:true,
   actions:s=>['addPork'],
   text:s=>`豚肉（${qty(s,'pork')}）を入れて、中火で焼きます。下に焼き色がついたものから順にひっくり返して、全体にうっすら色がついたら次へ進みます。`,
   tip:'フライパンが温まってから入れると、ジュッと音がします。入れたらすぐ触らず、ふちが白っぽくなって下がうっすら茶色くなったものから、菜箸で1枚ずつ返します。重なっていたらほぐしながら。全部返して、全体に焼き色がついたらキムチへ。'},
  {id:'kimchi',title:'キムチを入れて混ぜる',heat:2,time:'約1分',watch:'cook',
   actions:s=>['addKimchi',...(s.items.nira.on?['addNira']:[]),'stir:10'],

      if(p.red>.02){ctx.fillStyle=`rgba(212,52,30,${p.red*.5})`;ctx.fillRect(-p.w,-p.h,p.w*2,p.h*2)}
      if(p.sauce>.02){ctx.fillStyle=`rgba(86,36,12,${Math.min(.72,p.sauce*.62+p.glaze*.14)})`;ctx.fillRect(-p.w,-p.h,p.w*2,p.h*2)}
      if(p.glaze>.9){ctx.fillStyle=`rgba(20,8,2,${Math.min(.6,(p.glaze-.9)*1.2)})`;ctx.fillRect(-p.w,-p.h,p.w*2,p.h*2)}
      ctx.restore();
      this.porkPath(ctx,p,bend,sx);ctx.strokeStyle=rgb(lerpStops(PORK_STOPS,cd+.2),.9);ctx.lineWidth=3.2;ctx.stroke();
      const wet=Math.min(1,(Math.hypot(q.x-this.C.x,q.y-this.C.y)<this.oil.r?.5:.15)+p.sauce*.6+p.glaze*.3);ctx.strokeStyle=`rgba(255,255,255,${Math.min(.5,.24*wet)})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-p.w*.28,-p.h*.2+bend*p.h*.6);ctx.lineTo(p.w*.08,-p.h*.24+bend*p.h);ctx.stroke();
    } else if(p.t==='kimchi'){
      const cc=Math.min(1,p.c[0]);const base=mix([172,56,32],[128,32,20],cc*.7);this.blob(ctx,p);ctx.fillStyle=rgb(base);ctx.fill();ctx.shadowColor='transparent';
      ctx.save();this.blob(ctx,p);ctx.clip();
      ctx.lineCap='round';ctx.strokeStyle=rgb(mix([236,178,128],[200,110,80],cc*.5),.55);ctx.lineWidth=p.h*.26;ctx.beginPath();ctx.moveTo(-p.w*.36,(((p.seed*7)%1)-.5)*p.h*.5);ctx.quadraticCurveTo(0,(((p.seed*13)%1)-.5)*p.h*.9,p.w*.34,(((p.seed*3)%1)-.5)*p.h*.5);ctx.stroke();
      if(TEXK.ok){ctx.save();ctx.globalCompositeOperation='soft-light';ctx.globalAlpha=.7;ctx.translate((p.seed*41)%80,(p.seed*29)%60);ctx.fillStyle=TEXK.pat(ctx);ctx.fillRect(-300,-300,600,600);ctx.restore()}
      ctx.fillStyle='rgba(120,20,12,.55)';for(let i=0;i<3;i++){ctx.fillRect(Math.sin(p.seed*7+i*2.1)*p.w*.4,Math.cos(p.seed*3+i*1.7)*p.h*.3,1.6,1.6)}
      if(p.sauce>.02){ctx.fillStyle=`rgba(86,36,12,${Math.min(.55,p.sauce*.6)})`;ctx.fillRect(-p.w,-p.h,p.w*2,p.h*2)}
      ctx.restore();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(-p.w*.2,-p.h*.25);ctx.lineTo(p.w*.2,-p.h*.28);ctx.stroke();
    } else {
      const col=mix([92,168,58],[58,108,36],Math.min(1,p.c[0]));this.blob(ctx,p);ctx.fillStyle=rgb(col);ctx.fill();ctx.shadowColor='transparent';
      if(p.sauce>.02){ctx.fillStyle=`rgba(86,36,12,${Math.min(.5,p.sauce*.55)})`;this.blob(ctx,p);ctx.fill()}
    }
    ctx.restore()}
  drawSpat(ctx){if(!this.spOn&&!this.spUp)return;const C=this.C,x=this.spX,y=this.spY,a=this.spA;ctx.save();if(this.spUp)ctx.globalAlpha=.82;ctx.translate(x,y);ctx.rotate(a);
    // 柄は中心から外へ（進行方向と直角＝半径方向）
    const out=Math.atan2(y-C.y,x-C.x)-a;ctx.save();ctx.rotate(out);ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=6;ctx.shadowOffsetY=6;
    for(const o of [-3.4,3.4]){ctx.fillStyle='#e4c58a';ctx.beginPath();ctx.roundRect(8,o-2.1,66,4.2,2);ctx.fill();ctx.shadowColor='transparent';ctx.fillStyle='#111214';ctx.beginPath();ctx.roundRect(70,o-2.6,92,5.2,2.5);ctx.fill();
      const cs=['#d93a2f','#f2cf2c','#2fa84f'];for(let i=0;i<9;i++){ctx.fillStyle=cs[i%3];ctx.fillRect(76+i*9.2,o-2.6,2.4,5.2)};ctx.shadowColor='rgba(0,0,0,.45)'}
    ctx.restore();
    ctx.restore()}
  drawBottle(ctx){const b=this.bottle;if(!b)return;const col=b.k==='oil'?['#f0c53a','#fff3b0']:['#f4f6fa','#8a5a36'];
    ctx.save();ctx.globalAlpha=b.s;ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.ty-b.y,b.tx-b.x)-Math.PI/2+.0);
    ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=8;ctx.shadowOffsetY=8;ctx.fillStyle=b.k==='oil'?'#e8d8a0':'#2d3f9a';ctx.beginPath();ctx.roundRect(-14,-6,28,56,9);ctx.fill();ctx.shadowColor='transparent';
    ctx.fillStyle=col[0];ctx.beginPath();ctx.roundRect(-14,14,28,24,3);ctx.fill();ctx.fillStyle=b.k==='oil'?'#c9a227':'#c9a64a';ctx.fillRect(-7,-14,14,10);ctx.restore();
    ctx.save();ctx.globalAlpha=.9*b.s;ctx.strokeStyle=b.k==='oil'?'#f7d86a':'#4a2610';ctx.lineWidth=2.6;ctx.lineCap='round';const nx=b.x+(b.tx-b.x)*.18,ny=b.y+(b.ty-b.y)*.18;ctx.beginPath();ctx.moveTo(nx,ny);ctx.lineTo(b.tx,b.ty);ctx.stroke();
    ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.arc(b.tx,b.ty,4.5,0,7);ctx.fill();ctx.restore()}
  loop(){const f=t=>{requestAnimationFrame(f);const dt=Math.min(.05,(t-(this.last||t))/1000);this.last=t;if(this.paused||document.hidden)return;this.update(dt);this.draw()};requestAnimationFrame(f)}
}

/* ========== バックアップ ========== */
$('#bkOut').onclick=async()=>{
  const refs={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('gohan-ref:'))refs[k]=JSON.parse(localStorage.getItem(k))}}catch(e){}
  const data=JSON.stringify({v:1,setups:sget('gohan-setups',[]),refs});
  try{const dl=await claude.use('downloads');if(!dl){toast('この画面では書き出せません');return}await dl.save({filename:'recipe-simulator-backup.json',data});toast('書き出しました')}
  catch(e){if(e&&e.code==='declined')return;toast('この画面では書き出せませんでした')}};
$('#bkIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());
    const cur=sget('gohan-setups',[]);(j.setups||[]).forEach(x=>{const i=cur.findIndex(y=>y.recipe===x.recipe&&y.name===x.name);if(i>=0)cur[i]=x;else cur.push(x)});sset('gohan-setups',cur);
    Object.entries(j.refs||{}).forEach(([k,v])=>{if(k.startsWith('gohan-ref:')&&Array.isArray(v)){const old=sget(k,[]);sset(k,old.concat(v.filter(d=>!old.includes(d))))}});toast('読み込みました')}catch(err){toast('読み込めないファイルでした')}e.target.value=''};

renderMenu();
</script>
